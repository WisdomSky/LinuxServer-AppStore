name: linuxserver-onlyoffice
services:
  app:
    image: linuxserver/onlyoffice:10.0.0@sha256:f9a4d875e13fdd03aaf4698cb2e52c0c33dcdb1a8e43b8e101d1c4aa05a0b61f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/onlyoffice/config
        target: /config
