name: linuxserver-weixin
services:
  app:
    image: linuxserver/weixin:version-1a7800ae@sha256:ec4420ef26665941a2b448ff82ea7f9a2682ccaa5d8c6825c0765f032c1cafd0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/weixin/config
        target: /config
