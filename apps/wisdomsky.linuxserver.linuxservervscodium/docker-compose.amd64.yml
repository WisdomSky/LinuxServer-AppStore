name: linuxserver-vscodium
services:
  app:
    image: linuxserver/vscodium:1.143.17232@sha256:4416e110c1120196c37824b12939feeca6734e1275b2662031ce67f316e0a436
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
x-casaos:
