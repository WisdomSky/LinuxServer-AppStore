name: linuxserver-brave
services:
  app:
    image: linuxserver/brave:1.98.60@sha256:51a7829471ca2eeeac20dad29f5b8be43d165b2478e956041943ee3325b58e5d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/brave/config
        target: /config
