name: linuxserver-audiosilo
services:
  app:
    image: linuxserver/audiosilo:2.4.0@sha256:bf0e49b4ae1bec42a3005db4406d8aa6cdba9e98307c9eca2e35ea755df5c9b7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audiosilo/config
        target: /config
      - type: bind
        source: /DATA/AppData/audiosilo/audiobooks:ro
        target: /audiobooks:ro
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxserveraudiosilo/assets/icon.png
  title:
    en_US: Audiosilo (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxserveraudiosilo
  port_map: '8080'
  version: 2.4.0
