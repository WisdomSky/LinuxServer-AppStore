name: linuxserver-digikam
services:
  app:
    image: linuxserver/digikam:9.1.0@sha256:e6cd17d323e285e919a6f95f0f3c111f35a077e200c5b6ed4063438d5e971f9c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
