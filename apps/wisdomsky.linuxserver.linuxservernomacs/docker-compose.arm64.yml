name: linuxserver-nomacs
services:
  app:
    image: linuxserver/nomacs:3.22.4@sha256:1579f76cd219cd0f1c2f9f796a5787597f8e0881056bc9c46cc962d3af3f2e1b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nomacs/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservernomacs/assets/icon.png
  title:
    en_US: Nomacs (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservernomacs
  port_map: '3000'
  version: 3.22.4
