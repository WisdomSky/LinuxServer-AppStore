name: linuxserver-oscam
services:
  app:
    image: linuxserver/oscam:version-11987@sha256:236df9cc98c83c190c095b9d3f246202a1c07cf0fc4c99f02ad48f350276810a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/oscam/config
        target: /config
