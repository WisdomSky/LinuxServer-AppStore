name: linuxserver-craft-apps
services:
  app:
    image: linuxserver/craft-apps:0.21.0@sha256:c1568cff17ad1336a07cc7509be3448258f0ebcd10dfb55d88505a0a37796064
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/craft-apps/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercraftapps/assets/icon.png
  title:
    en_US: Craft apps (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercraftapps
  port_map: '3000'
  version: 0.21.0
