name: linuxserver-craft-apps
services:
  app:
    image: linuxserver/craft-apps:0.15.1@sha256:d41019ce0739816ba35ae8302102d784f219ed30a503a81c7ee70bab87826464
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/craft-apps/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercraftapps/assets/icon.png
  title:
    en_US: Craft apps (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercraftapps
  port_map: '3000'
  version: 0.15.1
