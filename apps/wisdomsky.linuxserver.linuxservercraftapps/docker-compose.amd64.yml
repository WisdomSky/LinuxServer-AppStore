name: linuxserver-craft-apps
services:
  app:
    image: linuxserver/craft-apps:0.18.0@sha256:0f680159fd9b686c716b82959a501df26c2c9599ee8a56f0afc6a92b3493b0a1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/craft-apps/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercraftapps/assets/icon.png
  title:
    en_US: Craft apps (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercraftapps
  port_map: '3000'
  version: 0.18.0
