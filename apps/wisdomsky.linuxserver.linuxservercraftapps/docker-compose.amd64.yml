name: linuxserver-craft-apps
services:
  app:
    image: linuxserver/craft-apps:0.17.0@sha256:7e65c4852b49559a20dd5ac7ba409c72bdb8f253caa3338d31e19f5e4c6c41eb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/craft-apps/config
        target: /config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/LinuxServer-AppStore@gh-pages/apps/wisdomsky.linuxserver.linuxservercraftapps/assets/icon.png
  title:
    en_US: Craft apps (LinuxServer.io)
  id: wisdomsky.linuxserver.linuxservercraftapps
  port_map: '3000'
  version: 0.17.0
