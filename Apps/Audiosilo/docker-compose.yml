name: linuxserver-audiosilo
services:
  app:
    image: linuxserver/audiosilo:2.5.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
        - container: PGID
          description:
            en_US: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
        - container: TZ
          description:
            en_US: specify a timezone to use, see this list.
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audiosilo/config
        target: /config
      - type: bind
        source: /DATA/AppData/audiosilo/audiobooks:ro
        target: /audiobooks:ro
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: AudioSilo is a self-hosted audiobook server. Point it at your audiobook folders and listen from the built-in web player or the AudioSilo apps for iOS and Android, with listening progress synced across devices.
  tagline:
    en_US: A self-hosted audiobook server. Point it at your audiobook folders and listen from the built-in web player or the AudioSilo apps for iOS and Android, with listening progress synced across devices.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audiosilo-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audiosilo-logo.png
  title:
    en_US: Audiosilo (LinuxServer.io)
  category: Media
  id: wisdomsky.linuxserver.linuxserveraudiosilo
  port_map: '8080'
  version: 2.5.0
